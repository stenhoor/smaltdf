name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # smaltdb is not on npm yet: build the commit pinned in packed.json and install it.
      - uses: actions/cache@v4
        with:
          path: |
            .cache/packed/*.tgz
            .cache/packed/*-files
          key: packed-${{ hashFiles('packed.json') }}
      - run: node scripts/fetch-packed.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The Polars comparison tests (DESIGN.md decision D): Python with the pinned Polars, apart from npm run check.
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: compare/requirements.txt
      - run: pip install -r compare/requirements.txt
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: |
            .cache/packed/*.tgz
            .cache/packed/*-files
          key: packed-${{ hashFiles('packed.json') }}
      - run: node scripts/fetch-packed.mjs
      - run: npm run compare
