name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Python Polars runs the differential tests (dev/CI only, never a package dependency).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install polars==2.1.0
      - run: npm ci
      # smaltdb is not on npm yet: build the commit pinned in packed.json and install it.
      - uses: actions/cache@v4
        with:
          path: |
            .cache/packed/*.tgz
            .cache/packed/*-files
          key: packed-${{ hashFiles('packed.json') }}
      - run: node scripts/fetch-packed.mjs
      - run: npm run typecheck
      - run: npm test
        env:
          SMALTDF_REQUIRE_POLARS: '1'
          PYTHON: python
      - run: npm run build
